    else if(command==='clearHistory'){saved.history=[];persist();renderSheet();announce('记录已清空')}
  });
  $('sheetBody').addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim().slice(0,22);const price=Number(f.get('price'));if(!name||!Number.isFinite(price)||price<1||price>999){announce('请输入菜名和 1～999 元的参考价格');return}const cat=String(f.get('cat'));const emoji=String(f.get('emoji'));if(!CAT[cat])return;const item={id:'custom_'+Date.now()+'_'+Math.floor(Math.random()*1e6),name,price:Math.round(price),cat,emoji,spicy:f.has('spicy'),veg:f.has('veg'),meat:!f.has('veg'),yulin:false,meals:[B,L,D,N],desc:'你亲手放进盲盒的私藏美食，当然值得期待！'};saved.custom.unshift(item);persist();updateCounts();closeSheet();announce(`「${name}」已加入盲盒 ✨`)});
  updateCounts();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
