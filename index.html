  const DEFAULT=RAW.map((x,i)=>({id:'base_'+i,name:x[0],emoji:x[1],cat:x[2],price:x[3],spicy:x[4],veg:x[5],meals:x[6],desc:x[7]}));
  const CAT={rice:'米饭',noodle:'粉面',snack:'小吃',light:'清爽',feast:'大餐'};
  const STORAGE='fanfan_blindbox_v1';
  let saved={favorites:[],excluded:[],custom:[],history:[],draws:[]};
  try{const old=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(old&&typeof old==='object'){for(const key of Object.keys(saved))if(Array.isArray(old[key]))saved[key]=old[key]}}catch(e){}
  let filter={meal:'all',cat:'all',budget:999,noSpicy:false,vegOnly:false};
  let current=null,rolling=false,lastResultId=null,sheetMode='',toastTimer=null;
  const $=id=>document.getElementById(id);
  const ITEMS=()=>DEFAULT.concat(saved.custom.filter(x=>x&&typeof x.name==='string'));
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(saved))}catch(e){}}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
  function candidates(){return ITEMS().filter(x=>!saved.excluded.includes(x.id)&&(filter.meal==='all'||x.meals.includes(filter.meal))&&(filter.cat==='all'||filter.cat===x.cat)&&x.price<=filter.budget&&(!filter.noSpicy||!x.spicy)&&(!filter.vegOnly||x.veg))}
  function updateCounts(){const list=candidates();$('availableCount').textContent=`可抽 ${list.length} 种美味`;$('favoriteCount').textContent=`已收藏 ${saved.favorites.length} 道`;$('menuCount').textContent=`共 ${ITEMS().length} 道菜`;$('drawCount').textContent=`今天已开盒 ${saved.draws.filter(d=>d===today()).length} 次`;return list}
  function announce(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
  function resetCard(){current=null;lastResultId=null;$('machine').classList.remove('revealed','rolling');$('foodEmoji').textContent='🎁';$('foodTitle').textContent='下一顿吃什么？';$('foodDesc').innerHTML='惊喜已经打包好啦<br>就差你点一下！';$('foodPrice').hidden=true;$('resultActions').classList.remove('show');$('decision').classList.remove('show');$('drawButtonText').textContent='开启好大儿的饭饭盲盒'}
  function changeFilter(){if(rolling)return;const list=updateCounts();if(current&&!list.some(x=>x.id===current.id))resetCard();if(!list.length){$('foodEmoji').textContent='🥲';$('foodTitle').textContent='饭缘暂时断线';$('foodDesc').textContent='筛选条件有点严格啦，放宽一点试试～';$('foodPrice').hidden=true;$('drawButtonText').textContent='调整一下筛选条件'}else if(!current){resetCard()}}
  function paint(item){$('foodEmoji').textContent=item.emoji;$('foodTitle').textContent=item.name;$('foodDesc').textContent=item.desc;$('foodPrice').hidden=false;$('foodPrice').textContent=`参考 ¥${item.price}/人 · ${CAT[item.cat]}`}
  function reveal(item){current=item;lastResultId=item.id;$('machine').classList.remove('rolling');$('machine').classList.add('revealed');paint(item);$('resultActions').classList.add('show');$('decision').classList.add('show');$('decision').textContent='✓ 决定了，今天就吃它！';$('drawButtonText').textContent='再开一个盲盒';$('saveBtn').classList.toggle('saved',saved.favorites.includes(item.id));$('saveBtn').textContent=saved.favorites.includes(item.id)?'♥ 已收藏':'♡ 收藏';saved.history.unshift({id:item.id,name:item.name,emoji:item.emoji,date:new Date().toISOString(),price:item.price});saved.history=saved.history.slice(0,60);saved.draws.unshift(today());saved.draws=saved.draws.slice(0,150);persist();updateCounts()}
  function draw(){if(rolling)return;const list=candidates();if(!list.length){announce('没有符合条件的菜啦，试试放宽筛选');return}rolling=true;$('drawButton').disabled=true;$('drawButtonText').textContent='正在打包你的饭缘…';$('decision').classList.remove('show');$('resultActions').classList.remove('show');$('machine').classList.remove('revealed');$('machine').classList.add('rolling');let pool=list.filter(x=>x.id!==lastResultId);if(!pool.length)pool=list;const chosen=pool[Math.floor(Math.random()*pool.length)];let index=0;const tick=setInterval(()=>{const item=list[Math.floor(Math.random()*list.length)];$('foodEmoji').textContent=item.emoji;$('foodTitle').textContent=item.name;$('foodDesc').textContent='正在认真挑选好吃的…';$('foodPrice').hidden=true;if(++index>=15){clearInterval(tick);rolling=false;$('drawButton').disabled=false;reveal(chosen)}},78)}
  function toggleFavorite(id){const idx=saved.favorites.indexOf(id);if(idx>=0)saved.favorites.splice(idx,1);else saved.favorites.unshift(id);persist();updateCounts();if(current?.id===id){$('saveBtn').classList.toggle('saved',saved.favorites.includes(id));$('saveBtn').textContent=saved.favorites.includes(id)?'♥ 已收藏':'♡ 收藏'}announce(idx>=0?'已取消收藏':'已放进你的心头好 💗')}
  function exclude(id){if(!saved.excluded.includes(id))saved.excluded.push(id);persist();if(current?.id===id)resetCard();changeFilter();announce('已排除，之后不会再抽到它');if(sheetMode==='menu')openSheet('menu')}
  function openSheet(mode){sheetMode=mode;$('sheetMask').classList.add('open');document.body.style.overflow='hidden';$('sheet').scrollTop=0;renderSheet()}
  function closeSheet(){sheetMode='';$('sheetMask').classList.remove('open');document.body.style.overflow=''}
  function renderSheet(){const body=$('sheetBody');body.innerHTML='';if(sheetMode==='favorites'){ $('sheetTitle').textContent='💗 我的心头好';$('sheetNote').textContent='真爱菜谱都在这里，哪天不想抽就直接翻牌。'; const list=saved.favorites.map(id=>ITEMS().find(x=>x.id===id)).filter(Boolean);body.innerHTML=list.length?'<div class="item-list">'+list.map(x=>itemHTML(x,'favorite')).join('')+'</div>':'<div class="sheet-empty">还没收藏过任何菜～<br>抽到喜欢的记得点一下 ♡</div>'; }
    if(sheetMode==='history'){$('sheetTitle').textContent='🕒 开盒记录';$('sheetNote').textContent=`最近 ${saved.history.length} 次抽取记录，只保存在本机。`;body.innerHTML=saved.history.length?'<div class="item-list">'+saved.history.map(x=>`<div class="item"><span class="item-emoji">${escapeHtml(x.emoji)}</span><div class="item-main"><div class="item-name">${escapeHtml(x.name)}</div><div class="item-info">${new Date(x.date).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · 参考 ¥${Number(x.price)||0}</div></div></div>`).join('')+'</div><div class="sheet-buttons"><button class="soft-button" data-command="clearHistory">清空记录</button></div>':'<div class="sheet-empty">还没开过盲盒～<br>今天的第一顿，从这里开始！</div>';}
    if(sheetMode==='menu'){$('sheetTitle').textContent='📋 我的菜单库';$('sheetNote').textContent=`内置 ${DEFAULT.length} 道菜，可以添加自己的口味。被排除的菜不会参与抽取。`;const list=ITEMS();body.innerHTML=`<div class="item-list">${list.map(x=>itemHTML(x,'menu')).join('')}</div><div class="sheet-buttons"><button class="soft-button primary" data-command="add">＋ 添加一道菜</button><button class="soft-button" data-command="clearExclude">恢复全部排除</button></div>`;}
    if(sheetMode==='add'){$('sheetTitle').textContent='➕ 添加想吃的';$('sheetNote').textContent='把私藏美食放进盲盒，下一次就有机会抽到。';body.innerHTML=`<form id="addForm"><div class="form-field"><label for="customName">菜名</label><input id="customName" name="name" maxlength="22" placeholder="比如：楼下那家炸酱面" required></div><div class="form-grid"><div class="form-field"><label for="customCat">类型</label><select id="customCat" name="cat"><option value="rice">🍚 米饭</option><option value="noodle">🍜 粉面</option><option value="snack">🥟 小吃</option><option value="light">🥗 清爽</option><option value="feast">🍗 大餐</option></select></div><div class="form-field"><label for="customPrice">参考单价（元）</label><input id="customPrice" name="price" inputmode="numeric" type="number" min="1" max="999" value="25" required></div></div><div class="form-field"><label for="customEmoji">代表表情</label><select id="customEmoji" name="emoji"><option>🍚</option><option>🍜</option><option>🥟</option><option>🍔</option><option>🍲</option><option>🥗</option><option>🍢</option><option>🍣</option><option>🍗</option><option>🥘</option><option>🍝</option><option>🌮</option></select></div><div class="form-switches"><label><input type="checkbox" name="spicy">有辣味</label><label><input type="checkbox" name="veg">是素食</label></div><button class="form-submit" type="submit">加入我的盲盒 ✨</button></form>`;}
  }
  function itemHTML(x,mode){const blocked=saved.excluded.includes(x.id),fav=saved.favorites.includes(x.id),custom=x.id.startsWith('custom_');return `<div class="item"><span class="item-emoji">${escapeHtml(x.emoji)}</span><div class="item-main"><div class="item-name">${escapeHtml(x.name)}${blocked?' · 已排除':''}</div><div class="item-info">参考 ¥${x.price} · ${CAT[x.cat]||'其他'}${custom?' · 自添加':''}</div></div>${mode==='favorite'?`<button class="item-btn heart" data-command="favorite" data-id="${escapeHtml(x.id)}">♥ 移除</button>`:`<button class="item-btn ${blocked?'':'block'}" data-command="${blocked?'unblock':'exclude'}" data-id="${escapeHtml(x.id)}">${blocked?'恢复':'排除'}</button>${custom?`<button class="item-btn" data-command="delete" data-id="${escapeHtml(x.id)}">删除</button>`:''}`}</div>`}
  $('mealTabs').addEventListener('click',e=>{const btn=e.target.closest('[data-meal]');if(!btn||rolling)return;filter.meal=btn.dataset.meal;document.querySelectorAll('[data-meal]').forEach(x=>x.classList.toggle('active',x===btn));changeFilter()});
  $('categoryChips').addEventListener('click',e=>{const btn=e.target.closest('[data-cat]');if(!btn||rolling)return;filter.cat=btn.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===btn));changeFilter()});
  $('budget').addEventListener('change',e=>{filter.budget=Number(e.target.value);changeFilter()});
  $('noSpicy').addEventListener('change',e=>{filter.noSpicy=e.target.checked;changeFilter()});
  $('vegOnly').addEventListener('change',e=>{filter.vegOnly=e.target.checked;changeFilter()});
  $('drawButton').addEventListener('click',draw);
  $('saveBtn').addEventListener('click',()=>{if(current)toggleFavorite(current.id)});
  $('skipBtn').addEventListener('click',()=>{if(current)exclude(current.id)});
  $('shareBtn').addEventListener('click',async()=>{if(!current)return;const message=`🍴 好大儿饭饭盲盒帮我选好了！\n今天吃：${current.name} ${current.emoji}\n参考预算：¥${current.price}/人\n你也来抽抽看～`;try{if(navigator.share){await navigator.share({title:'好大儿饭饭盲盒 · 今天吃什么',text:message})}else if(navigator.clipboard){await navigator.clipboard.writeText(message);announce('结果已复制，发给饭搭子吧！')}else{fallbackCopy(message)}}catch(e){if(e.name!=='AbortError')fallbackCopy(message)}});
  function fallbackCopy(str){const ta=document.createElement('textarea');ta.value=str;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');announce('结果已复制，发给饭搭子吧！')}catch(e){announce('当前浏览器不支持复制')}ta.remove()}
  $('decision').addEventListener('click',()=>{if(!current)return;$('decision').textContent=`🎉 祝你吃得开心！今天就是「${current.name}」`;announce('今天的饭决定啦，好好吃饭！')});
  $('historyBtn').addEventListener('click',()=>openSheet('history'));
  $('favoriteBtn').addEventListener('click',()=>openSheet('favorites'));
  $('manageBtn').addEventListener('click',()=>openSheet('menu'));
  $('addBtn').addEventListener('click',()=>openSheet('add'));
  $('sheetClose').addEventListener('click',closeSheet);
  $('sheetMask').addEventListener('click',e=>{if(e.target===$('sheetMask'))closeSheet()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
  $('sheetBody').addEventListener('click',e=>{const btn=e.target.closest('[data-command]');if(!btn)return;const {command,id}=btn.dataset;
    if(command==='add'){openSheet('add')}
    else if(command==='favorite'){toggleFavorite(id);renderSheet()}
    else if(command==='exclude'){exclude(id);renderSheet()}
    else if(command==='unblock'){saved.excluded=saved.excluded.filter(x=>x!==id);persist();changeFilter();renderSheet();announce('已经重新加入盲盒')}
    else if(command==='delete'){saved.custom=saved.custom.filter(x=>x.id!==id);saved.favorites=saved.favorites.filter(x=>x!==id);saved.excluded=saved.excluded.filter(x=>x!==id);if(current?.id===id)resetCard();persist();updateCounts();renderSheet();announce('自定义菜品已删除')}
    else if(command==='clearExclude'){saved.excluded=[];persist();changeFilter();renderSheet();announce('已恢复全部被排除的菜')}
    else if(command==='clearHistory'){saved.history=[];persist();renderSheet();announce('记录已清空')}
  });
  $('sheetBody').addEventListener('submit',e=>{if(e.target.id!=='addForm')return;e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim().slice(0,22);const price=Number(f.get('price'));if(!name||!Number.isFinite(price)||price<1||price>999){announce('请输入菜名和 1～999 元的参考价格');return}const cat=String(f.get('cat'));const emoji=String(f.get('emoji'));if(!CAT[cat])return;const item={id:'custom_'+Date.now()+'_'+Math.floor(Math.random()*1e6),name,price:Math.round(price),cat,emoji,spicy:f.has('spicy'),veg:f.has('veg'),meals:[B,L,D,N],desc:'你亲手放进盲盒的私藏美食，当然值得期待！'};saved.custom.unshift(item);persist();updateCounts();closeSheet();announce(`「${name}」已加入盲盒 ✨`)});
  updateCounts();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
